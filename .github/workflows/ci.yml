name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run Firefox, WebKit and additional Safari devices
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Checks for changed code
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Select checks from this change
        id: plan
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          E2E_FULL: ${{ inputs.full_browser_suite && '1' || '0' }}
        run: node scripts/ci-plan.mjs
      - run: node scripts/ci-run.mjs quality
      - if: ${{ steps.plan.outputs.e2e != 'true' }}
        run: node scripts/ci-run.mjs build
      - if: ${{ steps.plan.outputs.e2e == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 1

  e2e:
    name: Critical browser checks
    needs: quality
    if: ${{ needs.quality.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    env:
      E2E_FULL: ${{ inputs.full_browser_suite && '1' || '0' }}
      E2E_SKIP_BUILD: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: ci-plan }
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - if: ${{ !inputs.full_browser_suite }}
        run: npx playwright install --with-deps chromium
      - if: ${{ inputs.full_browser_suite }}
        run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/ci-run.mjs build
      - run: node scripts/ci-run.mjs e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
